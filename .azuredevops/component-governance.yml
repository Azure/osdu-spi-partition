# Component Governance registration for osdu-spi-partition (pilot, ADO Feature 84645).
#
# Runs in the OpenEnergyPlatform/OSDU-SPI Azure DevOps project through the Azure Pipelines GitHub App
# service connection, on the 1ES Official pipeline template. The template's enforced Component
# Governance step registers what this fork ships:
#   - the Maven graph of the Azure provider (MAVEN_ARGS limits detection to that module and its parents),
#   - the published container image (dockerImagesToScan),
#   - the OSDU community upstream commit the fork is built from (cgmanifest.json).
# The template always registers (scanType Register), so every run, including manual runs of other
# branches, records a snapshot for its branch. Compliance is read from main.
#
# 1ES network isolation applies to the job steps below and blocks public registries such as Maven Central
# and ghcr.io. The steps therefore only prepare tools and inputs and do not build. The Component
# Governance step runs after isolation stops: its Maven detector resolves the dependency tree from the
# public repositories in pom.xml and it pulls the images itself.
# Pilot note: once proven, this file moves to the Azure/osdu-spi template and is synced to every fork.

name: $(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: images
    displayName: Container images to scan (comma separated, empty to skip)
    type: string
    default: ghcr.io/azure/osdu-spi-partition:main-snapshot

trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - v*
    exclude:
      - v*-upstream-*

pr: none

schedules:
  - cron: '0 6 * * 1'
    displayName: Weekly registration of main
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

variables:
  - name: POOL_NAME
    value: adme-custom-pool-eus2
  - name: MAVEN_VERSION
    value: 3.9.12
  - name: MAVEN_SHA512
    value: 0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70
  - name: UPSTREAM_URL
    value: https://community.opengroup.org/osdu/platform/system/partition
  - name: OUT
    value: $(Build.ArtifactStagingDirectory)/cg-scan
  - name: NOTICE_OUT
    value: $(Build.ArtifactStagingDirectory)/cg-notice
  # The NOTICE job finds this run's snapshot by the scan job's display name.
  - name: CG_SCAN_PHASE
    value: Register shipped components

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    serviceTreeId: 461b68e8-f849-47b4-8b85-3182a2def8a7
    pool:
      name: $(POOL_NAME)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: $(POOL_NAME)
        os: linux
      credscan:
        enabled: true
      policheck:
        enabled: false
      antimalwareScan:
        enabled: false
        justificationForDisabling: 'Defender for Linux antimalware is unsupported on Azure Linux 3 (adme-custom-pool-eus2, the only 1ES pool available to this project) and network isolation precludes the ClamAV fallback. This pipeline only registers components with Component Governance; it publishes scan evidence, not binaries.'
      psscriptanalyzer:
        enabled: false
        justificationForDisabling: 'PSScriptAnalyzer (Guardian) is unsupported on Azure Linux 3 (adme-custom-pool-eus2); the repository contains no PowerShell.'
      binskim:
        enabled: false
      codeql:
        compiled:
          enabled: false

    stages:
      - stage: component_governance
        displayName: Component Governance
        jobs:
          - job: cg_scan
            displayName: ${{ variables.CG_SCAN_PHASE }}
            timeoutInMinutes: 60
            variables:
              # Read by Maven 3.9+ when the Component Governance Maven detector runs dependency:tree.
              MAVEN_ARGS: --settings=$(Build.SourcesDirectory)/.mvn/community-maven.settings.xml -P core,azure -pl provider/partition-azure -am
              # Read by the Component Governance step, which pulls the images after network isolation stops.
              dockerImagesToScan: ${{ parameters.images }}
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish scan inputs
                  targetPath: $(OUT)
                  artifactName: cg-scan
                  sbomEnabled: false
                  condition: succeededOrFailed()
            steps:
              - checkout: self
                fetchDepth: 0

              - bash: |
                  set -euo pipefail
                  for t in curl tar sha256sum sha512sum git; do
                    command -v "$t" >/dev/null || { echo "##[error]$t is required on the agent"; exit 1; }
                  done
                  v=$(sed -n 's:.*<java.version>\([0-9][0-9]*\)</java.version>.*:\1:p' pom.xml | head -1)
                  [ -n "$v" ] || { echo "##[error]java.version not found in pom.xml"; exit 1; }
                  jh="$AGENT_TOOLSDIRECTORY/microsoft-jdk-$v"
                  if [ ! -x "$jh/bin/java" ]; then
                    url="https://aka.ms/download-jdk/microsoft-jdk-$v-linux-x64.tar.gz"
                    tgz="$AGENT_TEMPDIRECTORY/microsoft-jdk-$v.tar.gz"
                    curl -fsSL --retry 3 -o "$tgz" "$url"
                    want=$(curl -fsSL --retry 3 "$url.sha256sum.txt" | awk '{print $1}')
                    got=$(sha256sum "$tgz" | awk '{print $1}')
                    [ -n "$want" ] && [ "$want" = "$got" ] || { echo "##[error]JDK checksum mismatch: $got != $want"; exit 1; }
                    mkdir -p "$jh"
                    tar -xzf "$tgz" -C "$jh" --strip-components=1
                  fi
                  mh="$AGENT_TOOLSDIRECTORY/apache-maven-$MAVEN_VERSION"
                  if [ ! -x "$mh/bin/mvn" ]; then
                    tgz="$AGENT_TEMPDIRECTORY/apache-maven-$MAVEN_VERSION-bin.tar.gz"
                    rm -f "$tgz"
                    for base in https://archive.apache.org/dist/maven/maven-3 https://dlcdn.apache.org/maven/maven-3; do
                      curl -fsSL --retry 2 --max-time 300 -o "$tgz" "$base/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" && break
                      echo "Maven download from $base failed"; rm -f "$tgz"
                    done
                    [ -s "$tgz" ] || { echo "##[error]Maven $MAVEN_VERSION could not be downloaded"; exit 1; }
                    echo "$MAVEN_SHA512  $tgz" | sha512sum -c -
                    mkdir -p "$mh"
                    tar -xzf "$tgz" -C "$mh" --strip-components=1
                  fi
                  "$jh/bin/java" -version 2>&1 | head -1
                  JAVA_HOME="$jh" MAVEN_ARGS= "$mh/bin/mvn" -v | head -1
                  echo "MAVEN_ARGS=$MAVEN_ARGS"
                  echo "dockerImagesToScan=${DOCKERIMAGESTOSCAN:-}"
                  echo "##vso[task.setvariable variable=JAVA_HOME]$jh"
                  echo "##vso[task.prependpath]$jh/bin"
                  echo "##vso[task.prependpath]$mh/bin"
                displayName: Set up JDK (pom.xml java.version) and Maven for detection

              - bash: |
                  set -euo pipefail
                  is_generated() { case "$(git log -1 --format=%s "$1")" in "chore: generate filtered upstream tree"|"chore: mirror upstream tree") return 0;; esac; return 1; }
                  filt=(--grep='^Upstream-Sha: [0-9a-f]\{40\}$' --grep='^Filter-Rev: ' --all-match)
                  cands=(); while read -r c; do is_generated "$c" && cands+=("$c"); done < <(git rev-list --topo-order "${filt[@]}" HEAD)
                  [ "${#cands[@]}" -gt 0 ] || { echo "##[error]No generated upstream commit is reachable from HEAD"; exit 1; }
                  chosen=${cands[0]}
                  others=0; while read -r c; do is_generated "$c" && others=$((others+1)); done < <(git rev-list "${filt[@]}" HEAD "^$chosen")
                  [ "$others" -eq 0 ] || { echo "##[error]Ambiguous upstream provenance"; exit 1; }
                  up=$(git log -1 --format='%(trailers:key=Upstream-Sha,valueonly,separator=)' "$chosen" | tr -d '[:space:]')
                  [ "$up" = "$(git rev-parse "$chosen^2")" ] || { echo "##[error]Upstream-Sha is not the second parent of $chosen"; exit 1; }
                  seeds=$(git log HEAD --grep='^Seeded-From: ' --format='%(trailers:key=Seeded-From,valueonly)' | awk 'NF >= 2 {print $2}')
                  shas=$(printf '%s\n' "$up" $seeds | awk '!seen[$0]++')
                  echo "upstream: $UPSTREAM_URL @ $up (generated commit $chosen); seeds: ${seeds:-none}"
                  {
                    printf '{\n  "$schema": "https://json.schemastore.org/component-detection-manifest.json",\n  "version": 1,\n  "registrations": [\n'
                    sep=""
                    for sha in $shas; do
                      [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "##[error]Invalid commit hash: $sha" >&2; exit 1; }
                      printf '%s    {"component": {"type": "git", "git": {"repositoryUrl": "%s", "commitHash": "%s"}}}' "$sep" "$UPSTREAM_URL" "$sha"
                      sep=$',\n'
                    done
                    printf '\n  ]\n}\n'
                  } > cgmanifest.json
                  mkdir -p "$OUT"
                  cp cgmanifest.json "$OUT/cgmanifest.json"
                  cat cgmanifest.json
                displayName: Record upstream provenance in cgmanifest.json

          # Runs after cg_scan because the template adds its Component Governance step after all steps of a job,
          # so a NOTICE step inside cg_scan would read the previous snapshot. No checkout: the template's
          # Component Governance step at the end of this job has nothing to register.
          - job: cg_notice
            displayName: Generate NOTICE from Component Governance
            dependsOn: cg_scan
            condition: succeeded()
            timeoutInMinutes: 30
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish Component Governance NOTICE
                  targetPath: $(NOTICE_OUT)
                  artifactName: cg-notice
                  sbomEnabled: false
                  condition: succeededOrFailed()
            steps:
              - checkout: none

              - bash: |
                  set -euo pipefail
                  command -v python3 >/dev/null || { echo "##[error]python3 is required on the agent"; exit 1; }
                  mkdir -p "$NOTICE_OUT"
                  python3 - <<'PY'
                  import base64, collections, json, os, re, time, urllib.error, urllib.parse, urllib.request

                  env = os.environ
                  auth = "Basic " + base64.b64encode((":" + env["SYSTEM_ACCESSTOKEN"]).encode()).decode()
                  out = env["NOTICE_OUT"]
                  ver = "api-version=7.1-preview.1"

                  def call(url, tries=3):
                      for attempt in range(1, tries + 1):
                          req = urllib.request.Request(url, headers={"Authorization": auth, "Accept": "application/json"})
                          try:
                              with urllib.request.urlopen(req, timeout=300) as r:
                                  return json.loads(r.read())
                          except urllib.error.HTTPError as e:
                              msg = f"GET {url.split('?')[0]} -> HTTP {e.code}: {e.read()[:300]!r}"
                              if e.code < 500 or attempt == tries:
                                  raise SystemExit(f"##[error]{msg}")
                          except (urllib.error.URLError, TimeoutError) as e:
                              msg = f"GET {url.split('?')[0]} -> {e}"
                              if attempt == tries:
                                  raise SystemExit(f"##[error]{msg}")
                          print(f"{msg}; retrying in 30 s")
                          time.sleep(30)

                  proj, repo, build = env["SYSTEM_TEAMPROJECTID"], env["BUILD_REPOSITORY_NAME"], env["BUILD_BUILDID"]
                  gov = call(f'{env["SYSTEM_COLLECTIONURI"]}_apis/resourceareas/7136235f-d277-4c27-9194-e3ada05fea2c?{ver}')["locationUrl"]
                  api = f"{gov.rstrip('/')}/{proj}/_apis/componentgovernance/governedrepositories"
                  repos = [r for r in call(f"{api}?{ver}")["value"] if (r.get("name") or "").lower() == repo.lower()]
                  if len(repos) != 1:
                      raise SystemExit(f"##[error]Expected one governed repository named {repo}, found {len(repos)}")
                  gid = repos[0]["id"]

                  # Registration is processed asynchronously; wait until the snapshot of this run's scan job is visible.
                  prefix = f'vsts://{env["SYSTEM_COLLECTIONID"]}/{proj}/{env["SYSTEM_DEFINITIONID"]}/'.lower()
                  phase = env["CG_SCAN_PHASE"]
                  for attempt in range(1, 21):
                      found = [(b, t) for b in call(f"{api}/{gid}/branches?{ver}")["value"] for t in b.get("snapshotTypes", [])
                               if t["buildType"].lower().startswith(prefix) and t.get("phaseDisplayName") == phase
                               and str(t.get("latestScanBuildIdentifier")) == build]
                      if found:
                          break
                      print(f"Snapshot of build {build} is not visible yet (attempt {attempt}); waiting 30 s")
                      time.sleep(30)
                  if len(found) != 1:
                      raise SystemExit(f"##[error]Expected one snapshot for build {build} job '{phase}', found {len(found)}")
                  branch, stype = found[0]
                  tid = stype["typeId"]
                  print(f"governed repository {gid}, branch {branch['moniker']}, snapshot type {tid}, build {build}")

                  res = call(f"{api}/{gid}/Notice?snapshotTypeId={tid}&format=text&{ver}")
                  content = res["content"].replace("\r\n", "\n")
                  excluded = res.get("excludedComponents") or {}
                  with open(os.path.join(out, "NOTICE"), "w", newline="\n") as f:
                      f.write(content)
                  with open(os.path.join(out, "notice-excluded.json"), "w") as f:
                      json.dump(excluded, f, indent=2)

                  entries = {}
                  for block in content.split("\n---------------------------------------------------------\n")[1:]:
                      m = re.match(r"(\S+) (\S+) - (.+)$", block.strip().splitlines()[0].strip()) if block.strip() else None
                      if m:
                          entries[(m.group(1).lower(), m.group(2).lower())] = m.group(3)
                  reasons = collections.defaultdict(set)
                  for reason, items in excluded.items():
                      for it in items:
                          if isinstance(it, str):
                              p = it.split("/")
                              if len(p) >= 5:
                                  reasons[(f"{p[2]}/{p[3]}".lower(), p[4].lower())].add(reason)
                          elif it.get("type") == "maven":
                              reasons[(it["displayName"].replace(":", "/").lower(), it["displayVersion"].lower())].add(reason)

                  moniker = urllib.parse.quote(urllib.parse.quote(branch["moniker"], safe=""), safe="")
                  regs = call(f"{api}/{gid}/branches/{moniker}/registrations?{ver}")["registrations"]
                  maven = sorted({(r["flatComponentVersion"]["displayName"].replace(":", "/").lower(), r["flatComponentVersion"]["displayVersion"].lower())
                                  for r in regs if r["flatComponentVersion"]["type"] == "maven"
                                  and any(p.get("phaseDisplayName") == phase for p in r.get("pipelines", []))})
                  missing = collections.defaultdict(list)
                  for gav in maven:
                      if gav not in entries:
                          missing[",".join(sorted(reasons.get(gav, []))) or "noReasonGiven"].append(f"{gav[0]}:{gav[1]}")
                  no_copyright = sum(1 for gav in entries if "noCopyright" in reasons.get(gav, ()))
                  report = {"governedRepository": gid, "snapshotType": tid, "build": build, "noticeEntries": len(entries),
                            "noticeEntriesWithoutCopyright": no_copyright, "registeredMaven": len(maven),
                            "registeredMavenNotInNotice": {k: v for k, v in sorted(missing.items())},
                            "excludedCounts": {k: len(v) for k, v in excluded.items()}}
                  with open(os.path.join(out, "notice-report.json"), "w") as f:
                      json.dump(report, f, indent=2)

                  print(f"NOTICE: {len(content)} characters, {len(entries)} entries ({no_copyright} without a copyright line)")
                  print("excluded by reason:", report["excludedCounts"])
                  print(f"registered Maven components: {len(maven)}, not in NOTICE: {sum(len(v) for v in missing.values())}")
                  md = ["## Component Governance NOTICE", "",
                        f"Snapshot type {tid} of build {build}: {len(entries)} entries, {no_copyright} without a copyright line.", "",
                        "Registered Maven components that are not in the NOTICE. Registrations include test scope, so this is not",
                        "the shipped set; the completeness check against the shipped jar runs where the jar is built.", "",
                        "| Reason | Count |", "| --- | --- |"]
                  md += [f"| {k} | {len(v)} |" for k, v in sorted(missing.items())]
                  for k, v in sorted(missing.items()):
                      print(f"  {k} ({len(v)}): " + ", ".join(v))
                      md += ["", f"**{k}**: " + ", ".join(f"`{x}`" for x in v)]
                  with open(os.path.join(out, "notice-report.md"), "w") as f:
                      f.write("\n".join(md) + "\n")
                  print(f"##vso[task.uploadsummary]{os.path.join(out, 'notice-report.md')}")
                  PY
                displayName: Fetch NOTICE for this run's snapshot
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)