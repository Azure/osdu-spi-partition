variables:
  CORE_BUILD_SUBDIR: partition-core

  # Full Docker Hub tag after "maven:" — flip to ...-temurin-25 for Java 25 compile/test.
  # Keep in sync with SERVICE_JAVA_VERSION (plugin-download jobs).
  # Dependency scanning: SBOM early-mover (sbom-maven.yml); do not set DS_JAVA_VERSION: "25".
  MAVEN_IMAGE_TAG: "3.9.16-eclipse-temurin-25"
  SERVICE_JAVA_VERSION: "3.9.16-eclipse-temurin-25"

  ACCEPTANCE_TEST_DIR: "partition-acceptance-test"

  CIMPL_OPENAPI_CONFIG_ROUTE: /api/partition/v1/api-docs/swagger-config
  SCHEMATHESIS_OPENAPI_YAML_ROUTE: /api/partition/v1/api-docs.yaml

include:
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "build/maven.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/gitlab-ultimate.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/sbom-maven.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "reporting/reporting.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "publishing/common-pages.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/fossa-maven.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/cimpl-global.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "reporting/schemathesis.yml"

  - local: "devops/core-plus/pipeline/override-stages.yml"

# Core-plus does not require a token. The shared schemathesis template fetches one
# whenever KEYCLOAK_ENDPOINT, CLIENT_ID, and CLIENT_SECRET are set, then sends it as
# Authorization. Clear them in the job shell so run_schemathesis.py skips the fetch.
# Job-level variables cannot override group CI variables of the same name.
.schemathesis-no-keycloak:
  before_script:
    - unset KEYCLOAK_ENDPOINT CLIENT_ID CLIENT_SECRET BEARER_TOKEN

schemathesis-prod-tests:
  extends:
    - .cimpl-prod-variables
    - .schemathesis-osdu-main-tests-template
    - .schemathesis-no-keycloak

schemathesis-dev-tests:
  extends:
    - .cimpl-dev-variables
    - .schemathesis-osdu-main-tests-template
    - .schemathesis-no-keycloak

schemathesis-dev-backup-tests:
  extends:
    - .cimpl-dev-backup-variables
    - .schemathesis-osdu-main-tests-template
    - .schemathesis-no-keycloak

# Java 25 FOSSA image (divido/fossa-with-cache!19). Shared fossa-maven.yml still
# defaults to v0.10 (JDK 17); override until ci-cd-pipelines bumps the default.
fossa-analyze:
  image: $CI_REGISTRY/divido/fossa-with-cache:v0.11

fossa-check-notice:
  image: $CI_REGISTRY/divido/fossa-with-cache:v0.11

download_plugins:
  image: maven:${SERVICE_JAVA_VERSION}
  stage: build
  variables:
    OSM_PACKAGE_REGISTRY_URL: "https://community.opengroup.org/api/v4/projects/1448/packages/maven"
    OSM_VERSION: "1.0.0"
  artifacts:
    paths:
      - ./tmp/*.jar
    when: always
    expire_in: 1 days
  script:
    - mvn dependency:copy -DrepoUrl=$OSM_PACKAGE_REGISTRY_URL -Dartifact="org.opengroup.osdu:os-osm-postgres:$OSM_VERSION:jar:plugin" -Dtransitive=false -DoutputDirectory="./tmp"
  rules:
    - if: "$PROTECTED == '1'"
      when: on_success

